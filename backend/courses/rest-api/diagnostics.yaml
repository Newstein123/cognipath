selection:
  max_capabilities: 3
  min_score: 0.15
  weights:
    uncertainty: 0.3
    stake: 0.2
    goal_relevance: 0.15
    leverage: 0.1
    calibration: 0.1
    claim_support: 0.15
  unready_penalty: 0.55
  secondary_coverage_discount: 0.7
items:
- id: test-diag-001
  capability: api-testing
  also_exercises: []
  level: foundation
  minutes: 6
  probes:
  - application
  - reasoning
  prompt: 'A teammate says: "I tested POST /tasks in the browser as Alice and it created the

    task, so it works. We don''t need automated tests." Their only check was that the

    page showed "Task created". What would you say to them? Describe what an automated

    test for creating a task should check, and name at least two failure cases it

    should also cover.

    '
  rubric:
  - id: test-d1-browser-not-proof
    criterion: Explains that one manual happy-path try is not proof - it covers one case once and will
      not catch later regressions.
    capability: api-testing
    weight: 1.0
  - id: test-d1-assert-status-body
    criterion: Says the test should assert the status code (201) and the response body (e.g. title, done
      defaulting to false).
    capability: api-testing
    weight: 1.0
  - id: test-d1-side-effect
    criterion: Says the test should check the database side effect - a row exists with the right title
      and owner_id 123.
    capability: api-testing
    weight: 1.0
  - id: test-d1-failure-cases
    criterion: Names at least two relevant failure cases (e.g. missing title, 201-character title, no
      token, expired token, invalid due date) with expected 4xx outcomes.
    capability: api-testing
    weight: 1.0
- id: test-diag-002
  capability: api-testing
  also_exercises: []
  level: foundation
  minutes: 8
  probes:
  - application
  - reasoning
  prompt: 'Bob (user 456) owns task 77. You want to prove that Alice (user 123) cannot read,

    change or delete it. Describe the test(s) you would write using arrange-act-assert:

    what you set up, which requests you send, what responses you expect, and what you

    check afterwards. Why is checking the status code alone not enough here?

    '
  rubric:
  - id: test-d2-two-users
    criterion: Arranges two users and a task owned by Bob, and uses Alice's valid token against Bob's
      task id (swapping the object id).
    capability: api-testing
    weight: 1.0
  - id: test-d2-all-methods
    criterion: Covers more than one method - at least GET plus PATCH or DELETE (ideally GET, PATCH and
      DELETE).
    capability: api-testing
    weight: 1.0
  - id: test-d2-expected-status
    criterion: Expects a refusal status of 403 or 404 (per the API's documented choice) and states it
      must never be 200/204 or include Bob's data.
    capability: api-testing
    weight: 1.0
  - id: test-d2-row-unchanged
    criterion: Checks the database afterwards that Bob's task still exists with its original owner, title
      and done value, explaining a handler might change data before refusing.
    capability: api-testing
    weight: 1.0
  - id: test-d2-control
    criterion: Mentions a control or isolation point, such as confirming Bob can still access task 77
      or that each test sets up its own data.
    capability: api-testing
    weight: 1.0
- id: authn-diag-001
  capability: authentication
  also_exercises: []
  level: foundation
  minutes: 6
  probes:
  - application
  - reasoning
  prompt: 'Alice has just logged in to TaskFlow with POST /v1/login. A minute later her app

    sends GET /v1/tasks to fetch her task list.


    How does the server know this second request comes from Alice? Describe what the

    login response gives her app, what her app must send with GET /v1/tasks (name the

    header), and what the server should reply if that credential is missing or has

    expired.

    '
  rubric:
  - id: authn-d1-login-returns-credential
    criterion: States that a successful login returns a credential such as a session cookie (Set-Cookie)
      or a token
    capability: authentication
    weight: 1.0
  - id: authn-d1-every-request
    criterion: Explains that the credential must be sent on every later request because HTTP is stateless
      (the server does not remember the earlier login by itself)
    capability: authentication
    weight: 1.5
  - id: authn-d1-names-header
    criterion: Names the correct header, either Cookie for a session or Authorization with the Bearer
      scheme for a token
    capability: authentication
    weight: 1.0
  - id: authn-d1-401
    criterion: Says a missing, invalid or expired credential gets 401 Unauthorized (not 403 or 200), ideally
      mentioning WWW-Authenticate
    capability: authentication
    weight: 1.0
- id: authn-diag-002
  capability: authentication
  also_exercises: []
  level: foundation
  minutes: 8
  probes:
  - application
  - reasoning
  - decision
  prompt: "TaskFlow's database was copied by an attacker. The users table looks like this:\n\n  id  |\
    \ email             | password_hash\n  123 | alice@example.com | 9028ea0d15decaa35b2da21c0290af3b1a5ba0a30a591906f89b5074e209ea72\n\
    \nThe hash is plain, unsalted SHA-256 of the password. A teammate says \"it's fine,\nhashes can't\
    \ be reversed\". The same teammate also wants to put the user's email\nand password hash inside the\
    \ JWT payload \"so the server doesn't need a database\nlookup\".\n\nDo you agree with each idea? Explain\
    \ what is risky and what TaskFlow should do\ninstead.\n"
  rubric:
  - id: authn-d2-fast-hash
    criterion: Explains that fast hashes like SHA-256 let attackers guess passwords very quickly, so "can't
      be reversed" does not make them safe for passwords
    capability: authentication
    weight: 1.5
  - id: authn-d2-salt
    criterion: Explains the role of a unique random salt per user (identical passwords no longer share
      a hash; precomputed tables stop working)
    capability: authentication
    weight: 1.0
  - id: authn-d2-slow-algorithm
    criterion: Recommends a slow, purpose-built password hashing algorithm such as Argon2id (or bcrypt/scrypt)
    capability: authentication
    weight: 1.0
  - id: authn-d2-jwt-readable
    criterion: Explains that a JWT payload is only encoded and signed, not encrypted, so anyone holding
      it can read it; secrets like password hashes must never go in it
    capability: authentication
    weight: 1.5
- id: authz-diag-001
  capability: authorization
  also_exercises: []
  level: foundation
  minutes: 6
  probes:
  - application
  - reasoning
  prompt: 'In the TaskFlow web app, the "Delete" button is only shown on tasks you own, so

    Alice never sees a Delete button on Bob''s task 77. A teammate concludes: "Users

    can only delete their own tasks, so DELETE /v1/tasks/{id} doesn''t need an

    ownership check."


    Is the teammate right? Explain what Alice could do, and what the server must do

    when it receives DELETE /v1/tasks/77 with Alice''s valid token.

    '
  rubric:
  - id: authz-d1-client-bypass
    criterion: Explains that the client is under the user's control, so Alice can send DELETE /v1/tasks/77
      directly (curl, developer tools, a script) without any button
    capability: authorization
    weight: 1.5
  - id: authz-d1-ui-not-security
    criterion: States that hiding buttons is user experience, not access control; the decision must be
      made on the server
    capability: authorization
    weight: 1.0
  - id: authz-d1-ownership-check
    criterion: Describes a server-side check comparing task 77's owner_id with the authenticated user's
      id (or a query scoped by owner_id) before deleting
    capability: authorization
    weight: 1.5
  - id: authz-d1-refusal-status
    criterion: Says the request should be refused with 403 Forbidden or 404 Not Found (not 200/204), and
      that a valid token alone is not enough
    capability: authorization
    weight: 1.0
- id: authz-diag-002
  capability: authorization
  also_exercises: []
  level: foundation
  minutes: 8
  probes:
  - application
  - reasoning
  - decision
  prompt: "Alice (user 123) is logged in to TaskFlow. Her app calls:\n\n  GET /v1/users/123/tasks\n  Authorization:\
    \ Bearer <Alice's valid token>\n\nand she sees her tasks. Out of curiosity she changes the URL to\n\
    GET /v1/users/456/tasks, keeps the same token, and the API answers 200 OK with\nBob's private tasks.\n\
    \nA teammate proposes a fix: \"Let's hide user IDs from the URLs and switch them\nto random UUIDs\
    \ so nobody can guess another user's ID.\"\n\nWhat is this vulnerability, and is the teammate's fix\
    \ enough? Explain what\nTaskFlow must do instead and what Alice should receive after the fix.\n"
  rubric:
  - id: authz-d2-names-bola
    criterion: Identifies the flaw as broken object level authorization (BOLA / IDOR, OWASP API1) — authentication
      worked but nobody checked that user 123 may read user 456's data
    capability: authorization
    weight: 1.0
  - id: authz-d2-hiding-not-access-control
    criterion: Explains that hiding or randomising IDs is not access control
    capability: authorization
    weight: 2.0
  - id: authz-d2-ids-leak
    criterion: Gives a reason the ID approach fails, such as IDs leaking through links, logs, screenshots
      or other API responses, or UUIDs only making guessing harder while the request still succeeds once
      the ID is known
    capability: authorization
    weight: 1.0
  - id: authz-d2-server-side-ownership-check
    criterion: Requires a server-side ownership check on every request using the identity from the session/token
    capability: authorization
    weight: 2.0
  - id: authz-d2-fixed-response
    criterion: States that after the fix Alice's request for /users/456/tasks is refused with 403 Forbidden
      or 404 Not Found and returns none of Bob's data
    capability: authorization
    weight: 1.0
- id: crud-diag-001
  capability: crud-databases
  also_exercises: []
  level: foundation
  minutes: 6
  probes:
  - application
  - reasoning
  prompt: 'A TaskFlow developer keeps all tasks in a list inside the server''s memory

    instead of a database. Alice creates the task "Buy milk" with POST /v1/tasks,

    and then the server is redeployed. Afterwards, GET /v1/tasks/42 returns

    404 Not Found. Explain what happened and why a database fixes it. Then name

    the SQL statement you would use for POST /v1/tasks and for GET /v1/tasks/42,

    and the success status code each endpoint should return.

    '
  rubric:
  - id: crud-d1-memory-lost
    criterion: Explains that in-memory data belongs to one server process and is lost on restart or redeploy
      (and is not shared between server copies).
    capability: crud-databases
    weight: 1.0
  - id: crud-d1-database-persists
    criterion: States that a database stores data persistently (on disk) so it outlives the server process.
    capability: crud-databases
    weight: 1.0
  - id: crud-d1-sql-mapping
    criterion: Maps POST /tasks to an INSERT into the tasks table and GET /tasks/42 to a SELECT filtered
      by id (WHERE id = 42 or a placeholder).
    capability: crud-databases
    weight: 1.0
  - id: crud-d1-status-codes
    criterion: Gives 201 Created for the successful POST and 200 OK for the successful GET.
    capability: crud-databases
    weight: 1.0
- id: crud-diag-002
  capability: crud-databases
  also_exercises: []
  level: foundation
  minutes: 7
  probes:
  - application
  - reasoning
  prompt: 'Alice (user 123) sends DELETE /v1/tasks/42 and gets 204 No Content. She

    accidentally sends the exact same request again. The server runs

    DELETE FROM tasks WHERE id = $1 AND owner_id = $2 both times.

    What does the database report the second time, what status code should

    TaskFlow return, and how does the server code decide that? Also explain

    what would go wrong if a bug removed the WHERE clause from this statement.

    '
  rubric:
  - id: crud-d2-zero-rows
    criterion: Explains that the second DELETE matches no row, so the database reports 0 rows affected
      without raising an error.
    capability: crud-databases
    weight: 1.0
  - id: crud-d2-404
    criterion: Says the server should return 404 Not Found (or justifies 204 as a documented idempotent
      choice) and that it decides by checking the affected row count.
    capability: crud-databases
    weight: 1.0
  - id: crud-d2-no-where
    criterion: Explains that DELETE without WHERE deletes every row in the tasks table (all users' tasks),
      with no confirmation.
    capability: crud-databases
    weight: 1.0
  - id: crud-d2-owner-filter
    criterion: Recognises the role of owner_id = $2 in restricting the delete to Alice's own tasks.
    capability: crud-databases
    weight: 0.5
- id: design-diag-001
  capability: endpoint-design
  also_exercises: []
  level: foundation
  minutes: 6
  probes:
  - application
  - reasoning
  prompt: 'In TaskFlow, Alice''s task 42 is {"title": "Buy milk", "done": false, "due_date": "2026-10-20"}.

    She taps the checkbox to mark it done. Which HTTP method and path should the app use,

    what request body should it send, and what status code and response body should it get back?

    A teammate suggests sending PUT /v1/tasks/42 with the body {"done": true} instead.

    Explain what would go wrong with that.

    '
  rubric:
  - id: design-d1-patch-path
    criterion: Chooses PATCH on the single-task URL /v1/tasks/42 (or /tasks/42), not the collection and
      not a verb path like /markDone.
    capability: endpoint-design
    weight: 1.0
  - id: design-d1-minimal-body
    criterion: 'Gives a body containing only the changed field, e.g. {"done": true}, and says the other
      fields stay unchanged.'
    capability: endpoint-design
    weight: 1.0
  - id: design-d1-success-response
    criterion: Expects 200 OK with the updated task in the body (or accepts 204 No Content as a valid
      alternative).
    capability: endpoint-design
    weight: 1.0
  - id: design-d1-put-replaces
    criterion: Explains that PUT replaces the whole representation, so the omitted title/due_date would
      be cleared or the request rejected (400/422) because title is required.
    capability: endpoint-design
    weight: 1.0
- id: design-diag-002
  capability: endpoint-design
  also_exercises: []
  level: foundation
  minutes: 8
  probes:
  - application
  - reasoning
  prompt: "A teammate built TaskFlow's task list as:\n  POST /getTasks   with body {\"page\": 3, \"only_open\"\
    : true}\nand deletion as:\n  GET /deleteTask?id=42   which returns 200 {\"status\": \"error\"} when\
    \ the task does not exist.\nRedesign both endpoints the RESTful way. For the list, show the exact\
    \ URL for the third page\nof 20 open tasks sorted by due date, and describe the shape of the response.\
    \ For deletion,\ngive the success status, and say what a client gets if it repeats the same delete.\n\
    Explain why the original designs are risky.\n"
  rubric:
  - id: design-d2-get-with-query
    criterion: Replaces POST /getTasks with GET /v1/tasks using query parameters, e.g. ?done=false&sort=due_date&limit=20&offset=40
      (correct offset 40 for page 3 of 20).
    capability: endpoint-design
    weight: 1.0
  - id: design-d2-paginated-shape
    criterion: Describes a paginated response with the list of tasks plus paging metadata (e.g. data array
      and pagination with limit, offset, total or next link), returned with 200.
    capability: endpoint-design
    weight: 1.0
  - id: design-d2-delete-method
    criterion: Replaces the GET with DELETE /v1/tasks/42 returning 204 No Content, and notes a repeat
      returns 404 while the server state is unchanged (idempotent).
    capability: endpoint-design
    weight: 1.0
  - id: design-d2-why-risky
    criterion: Explains the risks, e.g. GET must be safe so crawlers/previews/retries could delete data,
      reading via POST is not safe to retry or cache, and an error inside a 200 hides failure from clients.
    capability: endpoint-design
    weight: 1.0
  - id: design-d2-error-status
    criterion: Says a missing task should produce a real 4xx status (404) with a consistent error body
      rather than 200 with an error inside.
    capability: endpoint-design
    weight: 1.0
- id: req-diag-001
  capability: http-requests
  also_exercises: []
  level: foundation
  minutes: 6
  probes:
  - application
  - reasoning
  prompt: "In the TaskFlow app, Alice (user 123) does three things:\n  1. opens her task list,\n  2. adds\
    \ a new task \"Buy milk\",\n  3. deletes task 42.\nFor each action, which HTTP method and path should\
    \ the app use\n(the base URL is https://api.taskflow.example/v1)? For which of the three\nwould the\
    \ request carry a body, and what would be in it?\n"
  rubric:
  - id: req-d1-get-list
    criterion: Uses GET /tasks (or /v1/tasks) to view the task list and notes it needs no body.
    capability: http-requests
    weight: 1.0
  - id: req-d1-post-create
    criterion: Uses POST /tasks to create the task and says the body contains the new task's data, such
      as {"title":"Buy milk"} in JSON.
    capability: http-requests
    weight: 1.0
  - id: req-d1-delete
    criterion: Uses DELETE /tasks/42, identifying the task by the id in the path rather than in a body.
    capability: http-requests
    weight: 1.0
  - id: req-d1-path-vs-method
    criterion: Shows understanding that the path names the resource while the method names the action
      (for example, the same /tasks path is used with both GET and POST).
    capability: http-requests
    weight: 1.0
- id: req-diag-002
  capability: http-requests
  also_exercises: []
  level: foundation
  minutes: 8
  probes:
  - application
  - reasoning
  prompt: 'Bob''s phone loses signal just after sending a request, so the app never sees a response

    and does not know whether the server received it. The app has a "retry automatically"

    feature. Should it automatically retry (a) DELETE /v1/tasks/88 and (b) POST /v1/tasks

    with {"title": "Call mum"}? Explain your reasoning using the ideas of safe and

    idempotent methods, and say what could go wrong in the risky case.

    '
  rubric:
  - id: req-d2-idempotent-def
    criterion: Explains idempotent correctly - repeating the same request has the same intended effect
      on the server as sending it once.
    capability: http-requests
    weight: 1.0
  - id: req-d2-delete-retry
    criterion: Concludes that retrying the DELETE is harmless because DELETE is idempotent; the task ends
      up deleted either way, even if the second response is 404.
    capability: http-requests
    weight: 1.0
  - id: req-d2-post-duplicate
    criterion: Recognises that POST is not idempotent and that a retry may create a second "Call mum"
      task if the first request had succeeded.
    capability: http-requests
    weight: 1.0
  - id: req-d2-safe-distinction
    criterion: Distinguishes safe (read-only) from idempotent, noting that DELETE is idempotent but not
      safe.
    capability: http-requests
    weight: 0.5
  - id: req-d2-mitigation
    criterion: Suggests a way to make the POST retry safe, such as an idempotency key, or checking for
      the task before retrying.
    capability: http-requests
    weight: 0.5
- id: json-diag-001
  capability: json-resources
  also_exercises: []
  level: foundation
  minutes: 6
  probes:
  - application
  - reasoning
  prompt: "A TaskFlow client sends this body to POST /v1/tasks and the server rejects it:\n\n  {'title':\
    \ 'Buy milk', done: \"false\", }\n\nWhat is wrong with this JSON? Write a corrected version, and say\
    \ which HTTP header\nthe client should send so the server knows the body is JSON.\n"
  rubric:
  - id: json-d1-double-quotes
    criterion: Identifies that single quotes are invalid and keys and strings must use double quotes
    capability: json-resources
    weight: 1.0
  - id: json-d1-unquoted-key
    criterion: Identifies the unquoted key (done) as invalid JSON
    capability: json-resources
    weight: 1.0
  - id: json-d1-trailing-comma-and-type
    criterion: Identifies the trailing comma and/or that "false" is a string where the boolean false is
      expected
    capability: json-resources
    weight: 1.0
  - id: json-d1-content-type
    criterion: Names Content-Type application/json as the header that declares the body format
    capability: json-resources
    weight: 1.0
- id: json-diag-002
  capability: json-resources
  also_exercises: []
  level: foundation
  minutes: 7
  probes:
  - application
  - reasoning
  prompt: 'The TaskFlow team needs URLs for: (1) listing all of Alice''s (user 123) tasks,

    (2) fetching task 42, and (3) listing only tasks that are not done yet. A teammate

    proposes GET /getUserTasks?user=123, GET /task/42 and GET /tasks/notDone. Suggest

    better URLs and explain the rules you are following, including when to use a path

    segment versus a query parameter.

    '
  rubric:
  - id: json-d2-no-verbs-plural
    criterion: Removes verbs from paths and uses plural lowercase nouns (e.g. /tasks/42 instead of /task/42)
    capability: json-resources
    weight: 1.0
  - id: json-d2-nested-ownership
    criterion: Proposes /users/123/tasks (or /tasks?owner_id=123 with justification) for Alice's tasks,
      explaining nesting expresses ownership
    capability: json-resources
    weight: 1.0
  - id: json-d2-query-filter
    criterion: Uses a query parameter such as /tasks?done=false for the filter and explains filters are
      not separate resources
    capability: json-resources
    weight: 1.0
  - id: json-d2-collection-vs-item
    criterion: Distinguishes a collection (/tasks) from a single item identified by its id (/tasks/42)
    capability: json-resources
    weight: 1.0
- id: query-diag-001
  capability: queries-safety
  also_exercises: []
  level: foundation
  minutes: 6
  probes:
  - application
  - reasoning
  prompt: 'TaskFlow''s GET /v1/tasks endpoint is called like this:

    GET /v1/tasks?owner_id=123 , and the server runs

    SELECT id, title FROM tasks WHERE owner_id = $1 with $1 taken from the

    owner_id query parameter. The query uses a placeholder, so a teammate says

    "it''s safe". Bob is user 456. Is the endpoint safe? Explain what Bob could

    do, and how the server should decide whose tasks to return.

    '
  rubric:
  - id: query-d1-not-safe
    criterion: Says the endpoint is not safe even though it uses a placeholder, because the placeholder
      prevents injection but not reading other users' data.
    capability: queries-safety
    weight: 1.0
  - id: query-d1-attack
    criterion: Describes Bob changing the parameter to owner_id=123 and receiving Alice's tasks.
    capability: queries-safety
    weight: 1.0
  - id: query-d1-owner-from-token
    criterion: States that the owner id must come from the authenticated user (the verified token), not
      from anything the client sends.
    capability: queries-safety
    weight: 1.0
  - id: query-d1-drop-param
    criterion: Proposes removing or ignoring the owner_id parameter and filtering WHERE owner_id = the
      logged-in user's id.
    capability: queries-safety
    weight: 0.5
- id: query-diag-002
  capability: queries-safety
  also_exercises: []
  level: foundation
  minutes: 8
  probes:
  - application
  - reasoning
  prompt: 'TaskFlow''s search endpoint GET /v1/tasks?q=... builds its SQL like this:

    "SELECT id, title FROM tasks WHERE owner_id = 456 AND title ILIKE ''%" + q + "%''"

    Bob sends q = '' OR 1=1 --

    Write out the SQL the database actually receives, explain what result Bob

    gets and why, and rewrite the query so this attack cannot work.

    '
  rubric:
  - id: query-d2-final-sql
    criterion: Writes the resulting SQL showing the quote closing the string, OR 1=1 added, and the rest
      commented out by --.
    capability: queries-safety
    weight: 1.0
  - id: query-d2-all-rows
    criterion: Explains that the WHERE condition becomes true for every row, so Bob receives all users'
      tasks.
    capability: queries-safety
    weight: 1.0
  - id: query-d2-root-cause
    criterion: Identifies the root cause as user input concatenated into the SQL text, so the database
      cannot separate code from data.
    capability: queries-safety
    weight: 1.0
  - id: query-d2-parameterized
    criterion: Rewrites the query with placeholders (e.g. title ILIKE '%' || $2 || '%') and passes q as
      a separate parameter.
    capability: queries-safety
    weight: 1.0
- id: status-diag-001
  capability: status-codes
  also_exercises: []
  level: foundation
  minutes: 6
  probes:
  - application
  - reasoning
  prompt: 'In the TaskFlow app, Alice sends POST /v1/tasks with {"title": "Pay rent"} and the

    task is saved with id 43. Later, the app sends GET /v1/tasks/999, but no task 999

    exists. Which status code should TaskFlow return for each request, and why? For the

    first one, is there anything else the response should include to help the client?

    '
  rubric:
  - id: status-d1-created-201
    criterion: Chooses 201 Created for the successful POST that created a task (200 accepted only if the
      answer explains why 201 is more precise)
    capability: status-codes
    weight: 1.0
  - id: status-d1-location-header
    criterion: Mentions a Location header pointing to the new task's URL (e.g. /v1/tasks/43) and/or returning
      the created task in the body
    capability: status-codes
    weight: 1.0
  - id: status-d1-not-found-404
    criterion: Chooses 404 Not Found for the missing task and explains that the resource does not exist
    capability: status-codes
    weight: 1.0
  - id: status-d1-client-vs-server
    criterion: Recognises that the 404 is a client-side (4xx) outcome, not a server failure (5xx)
    capability: status-codes
    weight: 1.0
- id: status-diag-002
  capability: status-codes
  also_exercises: []
  level: foundation
  minutes: 7
  probes:
  - application
  - reasoning
  prompt: 'Task 42 in TaskFlow belongs to Alice (user 123). Three requests arrive:

    (a) DELETE /v1/tasks/42 with no Authorization header;

    (b) DELETE /v1/tasks/42 from Bob (user 456) with a valid token;

    (c) POST /v1/tasks from Alice where the server crashes with an unhandled database error.

    A colleague suggests returning 200 OK with {"error": "..."} in all three cases to

    "keep things simple". Which status code would you use for each, and what is wrong

    with the colleague''s idea?

    '
  rubric:
  - id: status-d2-unauthenticated-401
    criterion: Gives 401 for (a) because no valid credentials were sent, so the server doesn't know who
      the caller is
    capability: status-codes
    weight: 1.0
  - id: status-d2-forbidden-403
    criterion: Gives 403 for (b) because Bob is authenticated but not allowed to delete Alice's task (404
      to hide existence is also acceptable if explained)
    capability: status-codes
    weight: 1.0
  - id: status-d2-server-500
    criterion: Gives 500 (or 503 if framed as temporary unavailability) for (c) and says it's the server's
      fault, not the client's
    capability: status-codes
    weight: 1.0
  - id: status-d2-no-200-error
    criterion: Explains that 200 with an error body is wrong because clients, libraries, monitoring or
      retry logic rely on the status code and would treat the failure as success
    capability: status-codes
    weight: 1.0
- id: valid-diag-001
  capability: validation-errors
  also_exercises: []
  level: foundation
  minutes: 6
  probes:
  - application
  - reasoning
  prompt: 'The TaskFlow web form already refuses to submit a task with an empty title, so a

    teammate proposes removing the title check from the server''s POST /tasks handler

    "to avoid duplicate code". Alice''s teammate also wants the server to quietly cut any

    title longer than 200 characters down to 200 instead of returning an error.

    Do you agree with either idea? Explain what the server should do and why.

    '
  rubric:
  - id: valid-d1-server-must-validate
    criterion: Explains that client-side checks can be bypassed (e.g. by curl or a script calling the
      API directly), so the server must still validate the title.
    capability: validation-errors
    weight: 1.0
  - id: valid-d1-client-checks-purpose
    criterion: States that browser/form checks are still useful for user experience (fast feedback) but
      do not protect the server.
    capability: validation-errors
    weight: 1.0
  - id: valid-d1-reject-not-fix
    criterion: Rejects silent truncation, explaining that the user would lose data without knowing, and
      that the server should reject the request with an error instead.
    capability: validation-errors
    weight: 1.0
  - id: valid-d1-status-and-message
    criterion: Names a suitable 4xx status (422, or 400 if the API uses 400 for validation) and a message
      that names the field and the 1-200 character rule.
    capability: validation-errors
    weight: 1.0
- id: valid-diag-002
  capability: validation-errors
  also_exercises: []
  level: foundation
  minutes: 8
  probes:
  - application
  - reasoning
  prompt: "Today is 2026-10-14. For each TaskFlow request below, give the status code you would\nreturn\
    \ and a one-line reason, then sketch the JSON error body for case 2.\n  1. POST /tasks with body {\"\
    title\": \"Gym\", \"done\": true,}  (note the trailing comma)\n  2. POST /tasks with body {\"title\"\
    : \"Gym\", \"due_date\": \"2024-05-01\", \"owner_id\": 456}\n  3. GET /tasks/88888 where no task 88888\
    \ exists\n  4. The database crashes while handling a valid POST /tasks\nFor case 4, say what should\
    \ and should not appear in the response.\n"
  rubric:
  - id: valid-d2-malformed-400
    criterion: Gives 400 for case 1 because the JSON cannot be parsed (malformed syntax), distinguishing
      it from invalid values.
    capability: validation-errors
    weight: 1.0
  - id: valid-d2-semantic-errors
    criterion: For case 2 gives 422 (or 400, consistently) and identifies both problems - the past due_date
      and the disallowed owner_id field - reporting them together, ideally per field.
    capability: validation-errors
    weight: 1.0
  - id: valid-d2-not-found
    criterion: Gives 404 for case 3 because the specific task does not exist.
    capability: validation-errors
    weight: 1.0
  - id: valid-d2-500-no-leak
    criterion: Gives 500 for case 4 with a generic message, stating that stack traces, SQL errors or connection
      details must not be sent and should be logged on the server instead.
    capability: validation-errors
    weight: 1.0
  - id: valid-d2-structured-body
    criterion: Sketches a consistent structured error body (e.g. Problem Details with type, title, status,
      detail and an errors list) rather than a bare string.
    capability: validation-errors
    weight: 1.0
- id: web-diag-001
  capability: web-basics
  also_exercises: []
  level: foundation
  minutes: 6
  probes:
  - application
  - reasoning
  prompt: 'Alice opens the TaskFlow app on her phone and her list of tasks appears a second later.

    The tasks are stored on TaskFlow''s server, not on her phone.

    In a few sentences, explain what happened between her tapping the app and the list

    appearing. Who started the conversation, what was sent, and what came back?

    You may use an everyday analogy if it helps.

    '
  rubric:
  - id: web-d1-client-starts
    criterion: Identifies the phone app as the client that starts the exchange by sending a request, and
      the TaskFlow server as the side that responds.
    capability: web-basics
    weight: 1.0
  - id: web-d1-request-response
    criterion: Describes a request going to the server and a response coming back as one complete round
      trip (the request-response cycle).
    capability: web-basics
    weight: 1.0
  - id: web-d1-server-work
    criterion: Mentions that the server does work between request and response, such as looking up Alice's
      tasks in its database.
    capability: web-basics
    weight: 1.0
  - id: web-d1-data-not-page
    criterion: Recognises that the app receives data (for example JSON) that it displays itself, rather
      than a ready-made web page.
    capability: web-basics
    weight: 1.0
- id: web-diag-002
  capability: web-basics
  also_exercises: []
  level: foundation
  minutes: 7
  probes:
  - application
  - reasoning
  prompt: "Bob's app needs this URL: https://api.taskflow.example/v1/tasks?done=false#list\n(a) How does\
    \ his phone find out which computer to contact for api.taskflow.example?\n(b) Which parts of the URL\
    \ are actually sent to the server, and what does each mean?\n(c) Bob signed in a minute ago, yet his\
    \ next request without a token is rejected with\n    401 Unauthorized. Why does the server not remember\
    \ him?\n"
  rubric:
  - id: web-d2-dns
    criterion: Explains that a DNS lookup translates the host name into an IP address so the client can
      connect, and that DNS does not itself carry the request.
    capability: web-basics
    weight: 1.0
  - id: web-d2-url-parts
    criterion: Correctly identifies the scheme (https), host (api.taskflow.example), path (/v1/tasks)
      and query (done=false) and what each is for.
    capability: web-basics
    weight: 1.0
  - id: web-d2-fragment
    criterion: States that the fragment (#list) is not sent to the server.
    capability: web-basics
    weight: 1.0
  - id: web-d2-stateless
    criterion: Explains that HTTP is stateless, so each request must carry its own credentials (for example
      an Authorization token) because the server does not remember the earlier login.
    capability: web-basics
    weight: 1.0
