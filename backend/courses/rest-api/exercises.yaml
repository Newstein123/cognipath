exercises:
- chunk: api-testing.md#exercise-find-the-gaps-in-a-test-suite
  title: Find the gaps in a test suite
  capabilities:
  - api-testing
  level: foundation
  minutes: 10
  rubric:
  - id: test-e1-status-only
    criterion: Explains that asserting only 204 is insufficient because it does not prove the row was
      deleted, and adds a database check that task 42 is gone.
    capability: api-testing
    weight: 1.0
  - id: test-e1-not-found
    criterion: Adds a test for deleting a non-existent id expecting 404 (and no other rows affected).
    capability: api-testing
    weight: 1.0
  - id: test-e1-authentication
    criterion: Adds tests for no token and/or an expired token expecting 401, with task 42 still present
      afterwards.
    capability: api-testing
    weight: 1.0
  - id: test-e1-authorization
    criterion: Adds a test where Alice's token deletes Bob's task, expecting 403 or 404, and explains
      Bob is needed because IDOR can only be detected with a second user's object; checks Bob's row still
      exists.
    capability: api-testing
    weight: 1.0
  - id: test-e1-aaa-structure
    criterion: Gives each test a clear arrange, act and assert, with each test creating its own data.
    capability: api-testing
    weight: 1.0
- chunk: api-testing.md#exercise-design-tests-for-patch-tasks-id
  title: Design tests for PATCH /tasks/{id}
  capabilities:
  - api-testing
  level: foundation
  minutes: 10
  rubric:
  - id: test-e2-boundaries
    criterion: Includes boundary tests for title - empty or missing-length cases, 200 characters accepted,
      201 characters rejected with 422 (or 400).
    capability: api-testing
    weight: 1.0
  - id: test-e2-failure-coverage
    criterion: Covers wrong type for done, an unknown field, a missing task (404) and a missing token
      (401) with correct expected statuses.
    capability: api-testing
    weight: 1.0
  - id: test-e2-authorization
    criterion: Includes Alice patching Bob's task 77 expecting 403 or 404 and verifies Bob's row is unchanged.
    capability: api-testing
    weight: 1.0
  - id: test-e2-db-checks
    criterion: States database checks for rows - updated fields on success, row unchanged on every rejected
      request.
    capability: api-testing
    weight: 1.0
  - id: test-e2-isolation-pyramid
    criterion: Explains isolation (each test arranges its own data from a clean state, no order dependence)
      and places a pure 200-character rule check at the unit-test level.
    capability: api-testing
    weight: 1.0
- chunk: authentication.md#exercise-review-the-taskflow-login-design
  title: Review the TaskFlow login design
  capabilities:
  - authentication
  level: foundation
  minutes: 10
  rubric:
  - id: authn-e1-post-body
    criterion: Rejects credentials in the URL (logs, history) and replaces GET with POST /login carrying
      email and password in the request body
    capability: authentication
    weight: 1.0
  - id: authn-e1-password-hashing
    criterion: Replaces unsalted SHA-256 with a slow salted password hash such as Argon2id or bcrypt and
      explains why fast hashes are unsafe
    capability: authentication
    weight: 1.0
  - id: authn-e1-generic-error
    criterion: Identifies that different errors for "email not found" and "wrong password" reveal which
      emails have accounts, and proposes one generic 401 message for all login failures
    capability: authentication
    weight: 1.0
  - id: authn-e1-jwt-contents
    criterion: Removes the password hash (and unnecessary personal data) from the JWT because the payload
      is readable, and adds a short expiry (exp)
    capability: authentication
    weight: 1.0
- chunk: authentication.md#exercise-sessions-or-tokens-after-logout
  title: Sessions or tokens after logout
  capabilities:
  - authentication
  level: foundation
  minutes: 8
  rubric:
  - id: authn-e2-session-storage
    criterion: Explains that with sessions the server stores a session record and looks up the random
      ID on each request
    capability: authentication
    weight: 1.0
  - id: authn-e2-session-logout
    criterion: Concludes that if logout deleted the session on the server, the copied cookie now gets
      401 Unauthorized
    capability: authentication
    weight: 1.0
  - id: authn-e2-jwt-still-valid
    criterion: Explains that the server only verifies the JWT's signature and exp, so the copied 24-hour
      token still works after logout until it expires
    capability: authentication
    weight: 1.5
  - id: authn-e2-mitigation
    criterion: Recommends a sensible mitigation for (b), such as short-lived access tokens, a server-side
      deny-list or revocation, or switching to server-side sessions
    capability: authentication
    weight: 1.0
- chunk: authorization.md#exercise-investigate-the-task-sharing-bug-report
  title: Investigate the task-sharing bug report
  capabilities:
  - authorization
  level: foundation
  minutes: 10
  rubric:
  - id: authz-e1-bola-leaked-id
    criterion: Identifies broken object level authorization (BOLA/IDOR) and notes the attacker did not
      need to guess because the ID was shared in the link
    capability: authorization
    weight: 1.0
  - id: authz-e1-missing-ownership
    criterion: Points out that the UPDATE never checks that the task belongs to the authenticated user
      and proposes WHERE id = $x AND owner_id = <id from the token> (or load-then-compare)
    capability: authorization
    weight: 1.5
  - id: authz-e1-mass-assignment
    criterion: Points out that owner_id is taken from the request body (mass assignment) and must not
      be accepted from the client
    capability: authorization
    weight: 1.0
  - id: authz-e1-status-and-methods
    criterion: States the attacker should now get 404 Not Found or 403 Forbidden, and that DELETE (and
      every other method on the task) needs the same check
    capability: authorization
    weight: 1.0
  - id: authz-e1-uuid-not-enough
    criterion: Concludes that UUIDs would not have prevented this, because the ID was leaked and randomness
      is not a permission check
    capability: authorization
    weight: 1.0
- chunk: authorization.md#exercise-design-the-checks-for-a-new-admin-feature
  title: Design the checks for a new admin feature
  capabilities:
  - authorization
  level: foundation
  minutes: 10
  rubric:
  - id: authz-e2-identity-source
    criterion: Takes the user's identity and role from the verified token/session and server-side data,
      not from the URL, body or a client header
    capability: authorization
    weight: 1.0
  - id: authz-e2-role-check
    criterion: Requires a deny-by-default role check on GET /v1/admin/tasks so Alice (role user) gets
      403 Forbidden
    capability: authorization
    weight: 1.0
  - id: authz-e2-delete-rule
    criterion: Allows DELETE /v1/users/{id} only when the path id equals the authenticated user's id or
      the caller is an admin, giving (c) 403/404, (d) success such as 204, (e) success
    capability: authorization
    weight: 1.5
  - id: authz-e2-401-no-token
    criterion: Gives 401 Unauthorized for the request with no token, distinguishing it from 403
    capability: authorization
    weight: 1.0
  - id: authz-e2-owasp-categories
    criterion: Names broken function level authorization (API5) for the admin endpoint and broken object
      level authorization (API1) for deleting another user's account
    capability: authorization
    weight: 1.0
- chunk: crud-databases.md#exercise-map-the-request-to-sql
  title: Map the request to SQL
  capabilities:
  - crud-databases
  level: foundation
  minutes: 8
  rubric:
  - id: crud-e1-update-sql
    criterion: Writes an UPDATE on tasks that sets only title and due_date, using placeholders, with WHERE
      id = task id AND owner_id = Bob's id.
    capability: crud-databases
    weight: 1.0
  - id: crud-e1-value-sources
    criterion: States that the id comes from the URL (77), the owner id from the authenticated user (456),
      and the new values from the body ('Fix bike brakes', NULL).
    capability: crud-databases
    weight: 1.0
  - id: crud-e1-done-unchanged
    criterion: Explains that done is untouched because PATCH only changes fields present in the body,
      and that due_date is cleared because null means "remove the value".
    capability: crud-databases
    weight: 1.0
  - id: crud-e1-status
    criterion: Gives 200 OK with the updated task when Bob owns task 77, and 404 Not Found when it belongs
      to Alice because zero rows are updated.
    capability: crud-databases
    weight: 1.0
  - id: crud-e1-coalesce-bug
    criterion: Explains that COALESCE($2, due_date) keeps the old due date when the value is NULL, so
      the client could never clear it (null and missing become the same).
    capability: crud-databases
    weight: 1.0
- chunk: crud-databases.md#exercise-design-the-list-endpoint
  title: Design the list endpoint
  capabilities:
  - crud-databases
  level: foundation
  minutes: 8
  rubric:
  - id: crud-e2-select
    criterion: Writes a SELECT on tasks filtered by owner_id = Alice's id with ORDER BY due_date ascending
      and LIMIT/OFFSET placeholders (50, 50).
    capability: crud-databases
    weight: 1.0
  - id: crud-e2-tie-breaker
    criterion: Adds a second sort key such as id (or created_at) and explains that several tasks can share
      a due date, so one key does not fully determine the order.
    capability: crud-databases
    weight: 1.0
  - id: crud-e2-limit-cap
    criterion: Says the server should cap the limit at a maximum (e.g. 100) or reject the request with
      400, rather than passing 5000 to the database.
    capability: crud-databases
    weight: 1.0
  - id: crud-e2-no-order-bug
    criterion: Explains that without ORDER BY the database guarantees no order, so pages can repeat or
      skip tasks.
    capability: crud-databases
    weight: 1.0
  - id: crud-e2-empty-list
    criterion: Returns 200 OK with an empty items list, explaining the collection exists even when it
      has no rows.
    capability: crud-databases
    weight: 1.0
- chunk: endpoint-design.md#exercise-design-the-endpoints-for-task-comments
  title: Design the endpoints for task comments
  capabilities:
  - endpoint-design
  level: foundation
  minutes: 10
  rubric:
  - id: design-e1-endpoint-set
    criterion: Gives four endpoints with correct methods and noun-based paths, e.g. GET and POST /v1/tasks/{id}/comments,
      PATCH (or PUT) and DELETE /v1/comments/{id} (or a consistently nested equivalent).
    capability: endpoint-design
    weight: 1.0
  - id: design-e1-statuses-bodies
    criterion: States correct success statuses and bodies - 200 with a page of comments, 201 Created with
      a Location header and the comment, 200 with the updated comment, 204 No Content for delete.
    capability: endpoint-design
    weight: 1.0
  - id: design-e1-nesting-reason
    criterion: Justifies the nested-vs-flat choice, e.g. nest one level to list/create under a task and
      use flat URLs for an individual comment, avoiding deep paths.
    capability: endpoint-design
    weight: 1.0
  - id: design-e1-server-fields
    criterion: Identifies server-controlled fields the client must not send (id, task_id taken from the
      path, author_id from the token, created_at) and explains the security or integrity reason.
    capability: endpoint-design
    weight: 1.0
  - id: design-e1-pagination-delete-twice
    criterion: Shows a paginated list shape using query parameters (e.g. ?sort=-created_at&limit=20&offset=0
      returning data plus pagination) and says a second delete returns 404 while the state is unchanged.
    capability: endpoint-design
    weight: 1.0
- chunk: endpoint-design.md#exercise-fix-bob-s-disappearing-due-dates
  title: Fix Bob's disappearing due dates
  capabilities:
  - endpoint-design
  level: foundation
  minutes: 8
  rubric:
  - id: design-e2-diagnosis
    criterion: Explains that PUT replaces the whole representation, so omitting due_date set it to null,
      and that the server behaved correctly - the bug is in the client.
    capability: endpoint-design
    weight: 1.0
  - id: design-e2-two-fixes
    criterion: 'Gives two correct alternatives - PATCH /v1/tasks/7 with {"done": true}, and PUT /v1/tasks/7
      with the full task including the existing due_date - each with a 200 response showing due_date preserved.'
    capability: endpoint-design
    weight: 1.0
  - id: design-e2-retry-idempotency
    criterion: 'Reasons correctly about retrying - PUT is idempotent so a retry is harmless; PATCH {"done":
      true} gives the same result though PATCH in general is not guaranteed idempotent.'
    capability: endpoint-design
    weight: 1.0
  - id: design-e2-missing-required
    criterion: 'States that PUT with only {"done": true} would be rejected with 400 or 422 because the
      required title is missing, ideally with the standard error body.'
    capability: endpoint-design
    weight: 1.0
- chunk: http-requests.md#exercise-pick-the-method-for-each-action
  title: Pick the method for each action
  capabilities:
  - http-requests
  level: foundation
  minutes: 8
  rubric:
  - id: req-e1-methods-paths
    criterion: Chooses GET /tasks (ideally with ?done=false), POST /tasks, PATCH /tasks/91, and DELETE
      /tasks/91 for the four actions.
    capability: http-requests
    weight: 1.0
  - id: req-e1-bodies
    criterion: Correctly states which requests carry a body - POST with the new task's title and due date,
      PATCH with only the new due_date - and that GET and DELETE carry none, with the filter in the query
      string.
    capability: http-requests
    weight: 1.0
  - id: req-e1-properties
    criterion: Labels safety and idempotency correctly - GET safe and idempotent, POST neither, PATCH
      not safe and not guaranteed idempotent, DELETE idempotent but not safe.
    capability: http-requests
    weight: 1.0
  - id: req-e1-retry-post
    criterion: Explains that retrying the POST could create a duplicate "Renew passport" task if the first
      request actually succeeded.
    capability: http-requests
    weight: 1.0
  - id: req-e1-retry-delete
    criterion: Explains that retrying the DELETE is harmless because the final state is the same (task
      91 gone), even if the response changes to 404.
    capability: http-requests
    weight: 1.0
- chunk: http-requests.md#exercise-write-the-raw-request-and-fix-the-bug
  title: Write the raw request and fix the bug
  capabilities:
  - http-requests
  level: foundation
  minutes: 10
  rubric:
  - id: req-e2-request-line
    criterion: Writes a correct request line such as PATCH /v1/tasks/42 HTTP/1.1, with the path (not the
      full URL) as the target.
    capability: http-requests
    weight: 1.0
  - id: req-e2-headers-body
    criterion: Includes Host api.taskflow.example, Content-Type application/json and an Authorization
      Bearer header, then a blank line and a JSON body containing only the new title.
    capability: http-requests
    weight: 1.0
  - id: req-e2-curl
    criterion: Gives a working curl command using -X PATCH, -H for the Content-Type and Authorization
      headers, and -d with the JSON body.
    capability: http-requests
    weight: 1.0
  - id: req-e2-put-explained
    criterion: Explains that PUT replaces the whole resource, so a body with only the title is treated
      as the complete task and the due date is lost.
    capability: http-requests
    weight: 1.0
  - id: req-e2-two-fixes
    criterion: Gives two fixes - use PATCH with just the changed field, or use PUT with every field of
      the task included.
    capability: http-requests
    weight: 1.0
- chunk: json-resources.md#exercise-design-the-taskflow-urls
  title: Design the TaskFlow URLs
  capabilities:
  - json-resources
  level: foundation
  minutes: 8
  rubric:
  - id: json-e1-verbs-replaced
    criterion: Replaces verb paths (getAllTasks, tasks/create) with methods on nouns, e.g. GET /tasks
      and POST /tasks
    capability: json-resources
    weight: 1.0
  - id: json-e1-naming
    criterion: Fixes casing and singular naming (/Task/42 becomes /tasks/42)
    capability: json-resources
    weight: 1.0
  - id: json-e1-filter-query
    criterion: Replaces /tasks/completed with a query parameter such as /tasks?done=true
    capability: json-resources
    weight: 1.0
  - id: json-e1-shallow-nesting
    criterion: Simplifies the deep/redundant nested path to /tasks/42, noting the item id is enough and
      "details" is not a resource
    capability: json-resources
    weight: 1.0
  - id: json-e1-combined-request
    criterion: Writes a request like GET /users/123/tasks?done=false&sort=due_date and explains path =
      which resource (ownership), query = filter/sort
    capability: json-resources
    weight: 1.0
- chunk: json-resources.md#exercise-repair-and-explain-a-json-body
  title: Repair and explain a JSON body
  capabilities:
  - json-resources
  level: foundation
  minutes: 8
  rubric:
  - id: json-e2-syntax-errors
    criterion: Lists the syntax errors (unquoted key, single quotes, unquoted date, trailing comma)
    capability: json-resources
    weight: 1.0
  - id: json-e2-value-types
    criterion: Notes that "no" should be the boolean false and the date should be a string such as "2026-12-01"
    capability: json-resources
    weight: 1.0
  - id: json-e2-headers
    criterion: Adds Content-Type application/json (and optionally Accept and Authorization) to the corrected
      request
    capability: json-resources
    weight: 1.0
  - id: json-e2-owner-id-security
    criterion: Flags that the client should not set owner_id (Bob claiming user 123) and that the server
      derives the owner from the authenticated user
    capability: json-resources
    weight: 1.0
  - id: json-e2-representation
    criterion: Describes a returned JSON representation that includes server-set fields (id, owner_id,
      done default, created_at) and identifies them as server-generated
    capability: json-resources
    weight: 1.0
- chunk: queries-safety.md#exercise-review-the-search-endpoint
  title: Review the search endpoint
  capabilities:
  - queries-safety
  level: foundation
  minutes: 10
  rubric:
  - id: query-e1-two-problems
    criterion: Identifies both problems - the owner id is taken from the request (broken access control)
      and the values are concatenated into SQL (SQL injection).
    capability: queries-safety
    weight: 1.0
  - id: query-e1-owner-attack
    criterion: Gives a request such as GET /v1/tasks?owner=123&title= that lets Bob read Alice's tasks
      without SQL tricks.
    capability: queries-safety
    weight: 1.0
  - id: query-e1-injection-payload
    criterion: Gives a title value such as ' OR 1=1 -- and writes the resulting SQL, explaining why it
      returns every task.
    capability: queries-safety
    weight: 1.0
  - id: query-e1-safe-rewrite
    criterion: Rewrites the query with placeholders for both values, the owner id from the authenticated
      user and the title from the request as a parameter.
    capability: queries-safety
    weight: 1.0
- chunk: queries-safety.md#exercise-sign-up-and-account-deletion
  title: Sign-up and account deletion
  capabilities:
  - queries-safety
  level: foundation
  minutes: 10
  rubric:
  - id: query-e2-race
    criterion: Describes the race - both requests run the SELECT and find nothing before either INSERT
      runs, so both insert and two accounts exist.
    capability: queries-safety
    weight: 1.0
  - id: query-e2-unique-409
    criterion: Proposes a UNIQUE constraint on users.email, attempting the INSERT and mapping the unique-violation
      error (or ON CONFLICT with no row returned) to 409 Conflict with a clear error body.
    capability: queries-safety
    weight: 1.0
  - id: query-e2-fk-blocks
    criterion: Explains that with the default foreign key behaviour the DELETE of the user fails because
      tasks still reference him.
    capability: queries-safety
    weight: 1.0
  - id: query-e2-two-designs
    criterion: Gives two correct designs - deleting the tasks then the user inside one transaction (BEGIN/COMMIT,
      roll back on failure), and ON DELETE CASCADE on tasks.owner_id.
    capability: queries-safety
    weight: 1.0
- chunk: status-codes.md#exercise-choose-the-status-code
  title: Choose the status code
  capabilities:
  - status-codes
  level: foundation
  minutes: 8
  rubric:
  - id: status-e1-patch-200
    criterion: Gives 200 OK for the successful PATCH that returns the updated task
    capability: status-codes
    weight: 1.0
  - id: status-e1-validation-422
    criterion: Gives 422 (or 400 with justification) for the meaningless due_date value inside otherwise
      valid JSON, explaining the JSON parsed but the value is invalid
    capability: status-codes
    weight: 1.0
  - id: status-e1-forbidden-403
    criterion: Gives 403 for Bob reading Alice's task (or 404 to hide existence, with explanation), not
      401
    capability: status-codes
    weight: 1.0
  - id: status-e1-rate-limit-429
    criterion: Gives 429 Too Many Requests for the rate-limited script and mentions Retry-After
    capability: status-codes
    weight: 1.0
  - id: status-e1-class-contrast
    criterion: Gives 503 for the maintenance case and explains that situation 2 is 4xx (client must change
      the request) while 5 is 5xx (server failed; retrying later can work)
    capability: status-codes
    weight: 1.0
- chunk: status-codes.md#exercise-fix-the-error-responses
  title: Fix the error responses
  capabilities:
  - status-codes
  level: foundation
  minutes: 8
  rubric:
  - id: status-e2-explains-harm
    criterion: Explains concrete harms of always returning 200, covering at least two of mobile app error
      handling, monitoring/success metrics, and retry logic
    capability: status-codes
    weight: 1.0
  - id: status-e2-not-logged-in-401
    criterion: Rewrites "not logged in" as 401 Unauthorized, ideally with a WWW-Authenticate header
    capability: status-codes
    weight: 1.0
  - id: status-e2-not-found-404
    criterion: Rewrites "task not found" as 404 Not Found
    capability: status-codes
    weight: 1.0
  - id: status-e2-timeout-5xx
    criterion: Rewrites "database timeout" as a 5xx (503 with Retry-After, or 500) without leaking internal
      details
    capability: status-codes
    weight: 1.0
  - id: status-e2-consistent-body
    criterion: Uses one consistent error body format (e.g. machine-readable error code plus human message)
      across all three responses
    capability: status-codes
    weight: 1.0
- chunk: validation-errors.md#exercise-respond-to-three-bad-requests
  title: Respond to three bad requests
  capabilities:
  - validation-errors
  level: foundation
  minutes: 10
  rubric:
  - id: valid-e1-boolean-type
    criterion: For request 1 returns 422 (or 400 consistently) because "no" is a string, not a JSON boolean,
      and points at the done field.
    capability: validation-errors
    weight: 1.0
  - id: valid-e1-malformed
    criterion: For request 2 returns 400 because the body is not valid JSON and fields cannot be checked.
    capability: validation-errors
    weight: 1.0
  - id: valid-e1-multiple-errors
    criterion: For request 3 returns one response listing both the title-length error and the invalid
      date (month 13), each tied to its field.
    capability: validation-errors
    weight: 1.0
  - id: valid-e1-problem-details
    criterion: Writes response bodies in a consistent Problem Details style (type, title, status, detail,
      and an errors array where appropriate) with helpful, non-leaky messages.
    capability: validation-errors
    weight: 1.0
  - id: valid-e1-no-silent-fix
    criterion: Explains that truncating the title or ignoring the date silently changes the user's data
      and hides the mistake; the request should be rejected so the client can correct it.
    capability: validation-errors
    weight: 1.0
- chunk: validation-errors.md#exercise-review-an-error-handling-design
  title: Review an error-handling design
  capabilities:
  - validation-errors
  level: foundation
  minutes: 10
  rubric:
  - id: valid-e2-empty-list
    criterion: Identifies that an empty filter result should be 200 with an empty list [], not 404.
    capability: validation-errors
    weight: 1.0
  - id: valid-e2-server-error
    criterion: Identifies that a database failure is a server error (500, not 400) and that the response
      must not expose the connection string or internal address; details go to server logs.
    capability: validation-errors
    weight: 1.0
  - id: valid-e2-method-not-allowed
    criterion: Identifies that DELETE /tasks should return 405 Method Not Allowed with an Allow header
      listing GET, POST.
    capability: validation-errors
    weight: 1.0
  - id: valid-e2-validation-status
    criterion: Identifies that validation failures must use a 4xx status (422 or 400) rather than 200,
      with a structured body naming the field.
    capability: validation-errors
    weight: 1.0
  - id: valid-e2-security-risk
    criterion: Explains a concrete security risk, such as leaked hostnames, database type or paths helping
      an attacker map the system.
    capability: validation-errors
    weight: 1.0
- chunk: web-basics.md#exercise-trace-a-taskflow-request
  title: Trace a TaskFlow request
  capabilities:
  - web-basics
  level: foundation
  minutes: 8
  rubric:
  - id: web-e1-url-parts
    criterion: Names the scheme, host, path, query and fragment of the URL correctly.
    capability: web-basics
    weight: 1.0
  - id: web-e1-what-is-sent
    criterion: States that the request line carries the path and query (/v1/tasks?done=false), the host
