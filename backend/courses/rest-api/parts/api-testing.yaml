diagnostics:
  - id: test-diag-001
    capability: api-testing
    also_exercises: []
    level: foundation
    minutes: 6
    probes: [application, reasoning]
    prompt: |
      A teammate says: "I tested POST /tasks in the browser as Alice and it created the
      task, so it works. We don't need automated tests." Their only check was that the
      page showed "Task created". What would you say to them? Describe what an automated
      test for creating a task should check, and name at least two failure cases it
      should also cover.
    rubric:
      - id: test-d1-browser-not-proof
        criterion: Explains that one manual happy-path try is not proof - it covers one case once and will not catch later regressions.
        capability: api-testing
        weight: 1.0
      - id: test-d1-assert-status-body
        criterion: Says the test should assert the status code (201) and the response body (e.g. title, done defaulting to false).
        capability: api-testing
        weight: 1.0
      - id: test-d1-side-effect
        criterion: Says the test should check the database side effect - a row exists with the right title and owner_id 123.
        capability: api-testing
        weight: 1.0
      - id: test-d1-failure-cases
        criterion: Names at least two relevant failure cases (e.g. missing title, 201-character title, no token, expired token, invalid due date) with expected 4xx outcomes.
        capability: api-testing
        weight: 1.0
  - id: test-diag-002
    capability: api-testing
    also_exercises: []
    level: foundation
    minutes: 8
    probes: [application, reasoning]
    prompt: |
      Bob (user 456) owns task 77. You want to prove that Alice (user 123) cannot read,
      change or delete it. Describe the test(s) you would write using arrange-act-assert:
      what you set up, which requests you send, what responses you expect, and what you
      check afterwards. Why is checking the status code alone not enough here?
    rubric:
      - id: test-d2-two-users
        criterion: Arranges two users and a task owned by Bob, and uses Alice's valid token against Bob's task id (swapping the object id).
        capability: api-testing
        weight: 1.0
      - id: test-d2-all-methods
        criterion: Covers more than one method - at least GET plus PATCH or DELETE (ideally GET, PATCH and DELETE).
        capability: api-testing
        weight: 1.0
      - id: test-d2-expected-status
        criterion: Expects a refusal status of 403 or 404 (per the API's documented choice) and states it must never be 200/204 or include Bob's data.
        capability: api-testing
        weight: 1.0
      - id: test-d2-row-unchanged
        criterion: Checks the database afterwards that Bob's task still exists with its original owner, title and done value, explaining a handler might change data before refusing.
        capability: api-testing
        weight: 1.0
      - id: test-d2-control
        criterion: Mentions a control or isolation point, such as confirming Bob can still access task 77 or that each test sets up its own data.
        capability: api-testing
        weight: 1.0
exercises:
  - chunk: api-testing.md#exercise-find-the-gaps-in-a-test-suite
    title: Find the gaps in a test suite
    capabilities: [api-testing]
    level: foundation
    minutes: 10
    rubric:
      - id: test-e1-status-only
        criterion: Explains that asserting only 204 is insufficient because it does not prove the row was deleted, and adds a database check that task 42 is gone.
        capability: api-testing
        weight: 1.0
      - id: test-e1-not-found
        criterion: Adds a test for deleting a non-existent id expecting 404 (and no other rows affected).
        capability: api-testing
        weight: 1.0
      - id: test-e1-authentication
        criterion: Adds tests for no token and/or an expired token expecting 401, with task 42 still present afterwards.
        capability: api-testing
        weight: 1.0
      - id: test-e1-authorization
        criterion: Adds a test where Alice's token deletes Bob's task, expecting 403 or 404, and explains Bob is needed because IDOR can only be detected with a second user's object; checks Bob's row still exists.
        capability: api-testing
        weight: 1.0
      - id: test-e1-aaa-structure
        criterion: Gives each test a clear arrange, act and assert, with each test creating its own data.
        capability: api-testing
        weight: 1.0
  - chunk: api-testing.md#exercise-design-tests-for-patch-tasks-id
    title: Design tests for PATCH /tasks/{id}
    capabilities: [api-testing]
    level: foundation
    minutes: 10
    rubric:
      - id: test-e2-boundaries
        criterion: Includes boundary tests for title - empty or missing-length cases, 200 characters accepted, 201 characters rejected with 422 (or 400).
        capability: api-testing
        weight: 1.0
      - id: test-e2-failure-coverage
        criterion: Covers wrong type for done, an unknown field, a missing task (404) and a missing token (401) with correct expected statuses.
        capability: api-testing
        weight: 1.0
      - id: test-e2-authorization
        criterion: Includes Alice patching Bob's task 77 expecting 403 or 404 and verifies Bob's row is unchanged.
        capability: api-testing
        weight: 1.0
      - id: test-e2-db-checks
        criterion: States database checks for rows - updated fields on success, row unchanged on every rejected request.
        capability: api-testing
        weight: 1.0
      - id: test-e2-isolation-pyramid
        criterion: Explains isolation (each test arranges its own data from a clean state, no order dependence) and places a pure 200-character rule check at the unit-test level.
        capability: api-testing
        weight: 1.0
