diagnostics:
  - id: http-diag-001
    capability: http-basics
    also_exercises: []
    level: foundation
    minutes: 6
    probes: [application, reasoning]
    prompt: |
      You open a mobile app and tap "My profile". A moment later your name and photo
      appear on screen.

      In a few sentences, describe what happened between the app and the server:
        - What does the app send to the server, and roughly what does it contain?
        - What does the server send back?
        - If your profile had been deleted and no longer exists, what should the
          server send back instead, and how would the app know something went wrong?
    rubric:
      - id: http-d1-client-sends-request
        criterion: Says the app (the client) sends a request to the server asking for the profile, ideally naming GET as the method
        capability: http-basics
        weight: 1.0
      - id: http-d1-request-identifies-resource
        criterion: Mentions that the request identifies which profile is wanted, for example through a path or URL such as /users/42 or /profile
        capability: http-basics
        weight: 1.0
      - id: http-d1-response-has-status-and-data
        criterion: Says the server returns a response containing a success status (such as 200 OK) and the profile data, for example as JSON
        capability: http-basics
        weight: 1.0
      - id: http-d1-not-found-404
        criterion: Says that for a missing profile the server should return 404 Not Found, and that the app learns of the failure from that status code
        capability: http-basics
        weight: 1.5

  - id: http-diag-002
    capability: http-basics
    also_exercises: []
    level: foundation
    minutes: 7
    probes: [reasoning, application, decision]
    prompt: |
      A shopping app has a "Place order" button that sends `POST /orders`. On a slow
      connection, the app gets no answer and automatically sends the same request again.
      The customer ends up charged for two orders.

      1. Why did retrying cause a duplicate, when retrying `GET /orders/5` would not
         have caused any harm?
      2. Later, a customer who is logged in tries to view someone else's order and is
         refused. A visitor who is not logged in tries the same thing. Which status code
         should each of them get, and why are they different?
      3. If the server crashes with a bug while saving an order, which status code
         family (2xx, 4xx or 5xx) should the response come from, and why?
    rubric:
      - id: http-d2-post-not-idempotent
        criterion: Explains that POST creates something each time it is sent (it is not idempotent), so sending it twice can create two orders
        capability: http-basics
        weight: 1.5
      - id: http-d2-get-safe
        criterion: Explains that GET only reads data and does not change anything on the server, so repeating it is harmless
        capability: http-basics
        weight: 1.0
      - id: http-d2-401-vs-403
        criterion: Gives 403 Forbidden for the logged-in customer and 401 Unauthorized for the visitor who is not logged in, with the reason (authenticated but not allowed vs not authenticated)
        capability: http-basics
        weight: 1.5
      - id: http-d2-server-error-5xx
        criterion: Says a crash or bug on the server should produce a 5xx code such as 500 Internal Server Error, because the fault is on the server, not in the client's request
        capability: http-basics
        weight: 1.0

  - id: rest-diag-001
    capability: rest-design
    also_exercises: [http-basics]
    level: foundation
    minutes: 8
    probes: [application, decision, reasoning]
    prompt: |
      You are building the backend for a small recipe-sharing app. Users need to:
        - see a list of all recipes
        - see one recipe
        - add a new recipe
        - delete a recipe

      For each action, write the HTTP method and the URL path you would use (for
      example `GET /something`). Then answer:
        - What status code should the server return when a new recipe is successfully
          added?
        - What should it return when someone asks for a recipe that does not exist?
      Briefly explain one reason why a path like `/getAllRecipes` is a poor choice.
    rubric:
      - id: rest-d1-noun-paths
        criterion: Uses noun-based resource paths such as /recipes and /recipes/{id} rather than verbs in the path
        capability: rest-design
        weight: 1.5
      - id: rest-d1-correct-methods
        criterion: Pairs each action with a fitting method - GET for listing and fetching one, POST for adding, DELETE for deleting
        capability: rest-design
        weight: 1.5
      - id: rest-d1-201-created
        criterion: Gives 201 Created as the status for a successfully added recipe
        capability: http-basics
        weight: 1.0
      - id: rest-d1-404-missing
        criterion: Gives 404 Not Found for a recipe that does not exist
        capability: http-basics
        weight: 1.0
      - id: rest-d1-verb-in-path
        criterion: Explains that the action belongs in the HTTP method, so putting a verb like "get" in the path duplicates or conflicts with the method
        capability: rest-design
        weight: 1.0

  - id: rest-diag-002
    capability: rest-design
    also_exercises: [http-basics]
    level: foundation
    minutes: 8
    probes: [reasoning, decision, trade-offs]
    prompt: |
      A to-do app stores this task:

        { "id": 3, "title": "Write report", "done": false, "due": "2026-11-01" }

      A user taps a checkbox to mark the task as done. Two teammates disagree:
        - Ana wants the app to send `PUT /tasks/3` with the body `{ "done": true }`.
        - Ben wants it to send `PATCH /tasks/3` with the body `{ "done": true }`.

      Who is right, and why? Describe what the task might look like after Ana's request
      if the server follows PUT correctly. Then say which of the two methods is
      guaranteed to be safe to retry if the network fails, and why.
    rubric:
      - id: rest-d2-patch-partial
        criterion: Says PATCH is the right choice because it applies a partial change, leaving title and due date untouched
        capability: rest-design
        weight: 1.5
      - id: rest-d2-put-replaces
        criterion: Explains that PUT replaces the whole resource, so sending only done could wipe or drop the title and due date
        capability: rest-design
        weight: 1.5
      - id: rest-d2-put-idempotent
        criterion: Identifies PUT as idempotent - sending the same PUT again leaves the resource in the same state - while PATCH is not guaranteed to be
        capability: http-basics
        weight: 1.0
      - id: rest-d2-fix-put
        criterion: Notes that PUT could work if the client sent the complete task (title, done and due), not just the changed field
        capability: rest-design
        weight: 1.0

exercises:
  - chunk: http.md#exercise-read-a-failing-request
    title: Read a failing request
    capabilities: [http-basics]
    level: foundation
    minutes: 6
    rubric:
      - id: ex-fail-retry-unsafe
        criterion: Says blind automatic retries are not safe here, because the server may have created the order before failing, so a retry can create a duplicate
        capability: http-basics
        weight: 1.5
      - id: ex-fail-400-means-fix-request
        criterion: Explains that a 400 would mean the request itself is wrong, so retrying the same request unchanged would just fail again and the client must fix it first
        capability: http-basics
        weight: 1.5
      - id: ex-fail-500-server-fault
        criterion: Recognises that 500 signals a server-side failure, which is why retrying is tempting in the first place
        capability: http-basics
        weight: 1.0
      - id: ex-fail-post-not-idempotent
        criterion: Names non-idempotency of POST as the property that makes the retry risky
        capability: http-basics
        weight: 1.5

  - chunk: http.md#exercise-choose-the-status-code
    title: Choose the status code
    capabilities: [http-basics]
    level: foundation
    minutes: 6
    rubric:
      - id: ex-code-201-created
        criterion: Gives 201 Created for the saved new book, explaining that a new resource was created
        capability: http-basics
        weight: 1.0
      - id: ex-code-401-not-logged-in
        criterion: Gives 401 Unauthorized for the visitor who is not logged in, because the server does not know who they are
        capability: http-basics
        weight: 1.0
      - id: ex-code-403-not-allowed
        criterion: Gives 403 Forbidden for the logged-in student, because they are known but lack permission to delete
        capability: http-basics
        weight: 1.0
      - id: ex-code-404-missing
        criterion: Gives 404 Not Found for the request for book 9999, because that resource does not exist
        capability: http-basics
        weight: 1.0
      - id: ex-code-why-not-401
        criterion: Explains that 401 is wrong for the student because logging in again would not help - the problem is permission, not identity
        capability: http-basics
        weight: 1.0

  - chunk: rest-api.md#exercise-critique-an-endpoint
    title: Critique an endpoint
    capabilities: [rest-design]
    level: intermediate
    minutes: 8
    rubric:
      - id: ex-crit-verb-in-path
        criterion: Identifies the verb in the path (getUsersByStatus) and proposes a noun resource such as /users
        capability: rest-design
        weight: 1.0
      - id: ex-crit-post-for-read
        criterion: Identifies that POST is used for a read-only lookup and proposes GET with a query parameter, such as GET /users?status=active
        capability: rest-design
        weight: 1.0
      - id: ex-crit-success-flag
        criterion: Identifies that a success flag inside a 200 body duplicates the status code and proposes relying on HTTP status codes for success and failure
        capability: rest-design
        weight: 1.0
      - id: ex-crit-no-pagination
        criterion: Identifies that returning all 40,000 users is a problem and proposes pagination such as a limit with a cursor or offset
        capability: rest-design
        weight: 1.0
      - id: ex-crit-prioritises
        criterion: Picks one change to make first and justifies it by its impact, for example pagination because of load and latency, or GET because it unlocks caching and correct semantics
        capability: rest-design
        weight: 1.0

  - chunk: rest-api.md#exercise-design-a-profile-api
    title: Design a profile API
    capabilities: [rest-design]
    level: foundation
    minutes: 8
    rubric:
      - id: ex-prof-paths
        criterion: Uses a noun collection and item path such as /profiles and /profiles/{id} (or /students/{id}/profile) with no verbs in the path
        capability: rest-design
        weight: 1.0
      - id: ex-prof-get-post-delete
        criterion: Uses GET to retrieve, POST to create (on the collection), and DELETE to delete, with success codes of 200 OK for GET, 201 Created for POST, and 204 No Content (or 200 OK) for DELETE
        capability: rest-design
        weight: 1.5
      - id: ex-prof-put-vs-patch
        criterion: Uses PUT for the full replacement and PATCH for updating only the email, with 200 OK (or 204 No Content) on success
        capability: rest-design
        weight: 1.5
      - id: ex-prof-404
        criterion: Says a missing profile should return 404 Not Found
        capability: rest-design
        weight: 1.0
      - id: ex-prof-why-status-codes
        criterion: Explains that a real status code lets clients and tools detect the failure without parsing the body, whereas 200 with an error message hides it
        capability: rest-design
        weight: 1.0
