diagnostics:
  - id: valid-diag-001
    capability: validation-errors
    also_exercises: []
    level: foundation
    minutes: 6
    probes: [application, reasoning]
    prompt: |
      The TaskFlow web form already refuses to submit a task with an empty title, so a
      teammate proposes removing the title check from the server's POST /tasks handler
      "to avoid duplicate code". Alice's teammate also wants the server to quietly cut any
      title longer than 200 characters down to 200 instead of returning an error.
      Do you agree with either idea? Explain what the server should do and why.
    rubric:
      - id: valid-d1-server-must-validate
        criterion: Explains that client-side checks can be bypassed (e.g. by curl or a script calling the API directly), so the server must still validate the title.
        capability: validation-errors
        weight: 1.0
      - id: valid-d1-client-checks-purpose
        criterion: States that browser/form checks are still useful for user experience (fast feedback) but do not protect the server.
        capability: validation-errors
        weight: 1.0
      - id: valid-d1-reject-not-fix
        criterion: Rejects silent truncation, explaining that the user would lose data without knowing, and that the server should reject the request with an error instead.
        capability: validation-errors
        weight: 1.0
      - id: valid-d1-status-and-message
        criterion: Names a suitable 4xx status (422, or 400 if the API uses 400 for validation) and a message that names the field and the 1-200 character rule.
        capability: validation-errors
        weight: 1.0
  - id: valid-diag-002
    capability: validation-errors
    also_exercises: []
    level: foundation
    minutes: 8
    probes: [application, reasoning]
    prompt: |
      Today is 2026-10-14. For each TaskFlow request below, give the status code you would
      return and a one-line reason, then sketch the JSON error body for case 2.
        1. POST /tasks with body {"title": "Gym", "done": true,}  (note the trailing comma)
        2. POST /tasks with body {"title": "Gym", "due_date": "2024-05-01", "owner_id": 456}
        3. GET /tasks/88888 where no task 88888 exists
        4. The database crashes while handling a valid POST /tasks
      For case 4, say what should and should not appear in the response.
    rubric:
      - id: valid-d2-malformed-400
        criterion: Gives 400 for case 1 because the JSON cannot be parsed (malformed syntax), distinguishing it from invalid values.
        capability: validation-errors
        weight: 1.0
      - id: valid-d2-semantic-errors
        criterion: For case 2 gives 422 (or 400, consistently) and identifies both problems - the past due_date and the disallowed owner_id field - reporting them together, ideally per field.
        capability: validation-errors
        weight: 1.0
      - id: valid-d2-not-found
        criterion: Gives 404 for case 3 because the specific task does not exist.
        capability: validation-errors
        weight: 1.0
      - id: valid-d2-500-no-leak
        criterion: Gives 500 for case 4 with a generic message, stating that stack traces, SQL errors or connection details must not be sent and should be logged on the server instead.
        capability: validation-errors
        weight: 1.0
      - id: valid-d2-structured-body
        criterion: Sketches a consistent structured error body (e.g. Problem Details with type, title, status, detail and an errors list) rather than a bare string.
        capability: validation-errors
        weight: 1.0
exercises:
  - chunk: validation-errors.md#exercise-respond-to-three-bad-requests
    title: Respond to three bad requests
    capabilities: [validation-errors]
    level: foundation
    minutes: 10
    rubric:
      - id: valid-e1-boolean-type
        criterion: For request 1 returns 422 (or 400 consistently) because "no" is a string, not a JSON boolean, and points at the done field.
        capability: validation-errors
        weight: 1.0
      - id: valid-e1-malformed
        criterion: For request 2 returns 400 because the body is not valid JSON and fields cannot be checked.
        capability: validation-errors
        weight: 1.0
      - id: valid-e1-multiple-errors
        criterion: For request 3 returns one response listing both the title-length error and the invalid date (month 13), each tied to its field.
        capability: validation-errors
        weight: 1.0
      - id: valid-e1-problem-details
        criterion: Writes response bodies in a consistent Problem Details style (type, title, status, detail, and an errors array where appropriate) with helpful, non-leaky messages.
        capability: validation-errors
        weight: 1.0
      - id: valid-e1-no-silent-fix
        criterion: Explains that truncating the title or ignoring the date silently changes the user's data and hides the mistake; the request should be rejected so the client can correct it.
        capability: validation-errors
        weight: 1.0
  - chunk: validation-errors.md#exercise-review-an-error-handling-design
    title: Review an error-handling design
    capabilities: [validation-errors]
    level: foundation
    minutes: 10
    rubric:
      - id: valid-e2-empty-list
        criterion: Identifies that an empty filter result should be 200 with an empty list [], not 404.
        capability: validation-errors
        weight: 1.0
      - id: valid-e2-server-error
        criterion: Identifies that a database failure is a server error (500, not 400) and that the response must not expose the connection string or internal address; details go to server logs.
        capability: validation-errors
        weight: 1.0
      - id: valid-e2-method-not-allowed
        criterion: Identifies that DELETE /tasks should return 405 Method Not Allowed with an Allow header listing GET, POST.
        capability: validation-errors
        weight: 1.0
      - id: valid-e2-validation-status
        criterion: Identifies that validation failures must use a 4xx status (422 or 400) rather than 200, with a structured body naming the field.
        capability: validation-errors
        weight: 1.0
      - id: valid-e2-security-risk
        criterion: Explains a concrete security risk, such as leaked hostnames, database type or paths helping an attacker map the system.
        capability: validation-errors
        weight: 1.0
