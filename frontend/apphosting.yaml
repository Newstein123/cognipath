# Firebase App Hosting settings for the Next.js frontend.
# https://firebase.google.com/docs/app-hosting/configure

runConfig:
  minInstances: 0
  maxInstances: 2

env:
  # Where the Cognith backend runs: the Cloud Run service URL, no trailing slash.
  # Next.js bakes NEXT_PUBLIC_* into the browser bundle at build time, so BUILD is
  # required; changing it needs a new rollout, not just a restart.
  - variable: NEXT_PUBLIC_API_URL
    value: https://REPLACE-WITH-CLOUD-RUN-URL.run.app
    availability:
      - BUILD
      - RUNTIME
